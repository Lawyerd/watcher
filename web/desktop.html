<!doctype html>
<html lang="ko"><head>
<meta charset="utf-8">
<title>CNC Watcher</title>
<style>
/*@FONTS@*/
  /* 다크 팔레트 — v2.3에서 정한 색 그대로 (색 추가/변경은 여기서만) */
  :root { --bg:#131316; --card:#1C1C21; --line:#2C2C33; --text:#F2F2F7; --val:#D1D1D6; --muted:#8E8E93; --sub:#636366;
          --btn:#26262C; --btn-hov:#33333A; --outline:#3A3A42; --accent:#0A84FF; --accent-hov:#0B6FD6;
          --green:#30D158; --green-bg:#0E2E1A; --red:#FF453A; --yellow:#FFD60A;
          --alm-code:#FF6961; --alm-msg:#F2C9C6; --alm-sub:#8E5A56; --alm-line:#3A1B18;
          --mono: "JetBrains Mono", "Cascadia Mono", Consolas, monospace; --ui: "Malgun Gothic", "Segoe UI", sans-serif; }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--text); font-family: var(--ui); overflow: hidden; user-select: none; }
  button { font-family: inherit; }
  .mono { font-family: var(--mono); }

  /* ── 타이틀바 (헤더 = 타이틀바, 왼쪽 요약 영역만 끌어서 이동) ── */
  .titlebar { display: flex; align-items: center; height: 50px; border-bottom: 1px solid var(--line); }
  .titlebar .drag { flex: 1; height: 100%; display: flex; align-items: center; gap: 7px; padding-left: 20px; min-width: 0; }
  #dot { font-size: 13px; color: #5A5A60; }
  #sum { font-size: 14px; font-weight: 700; white-space: nowrap; }
  #total { font-size: 12px; color: var(--sub); white-space: nowrap; }
  .ibtn { width: 32px; height: 30px; border: 0; border-radius: 6px; background: none; color: var(--muted); margin-right: 2px;
          display: flex; align-items: center; justify-content: center; cursor: pointer; }
  .ibtn:hover { background: var(--btn); }
  .ibtn.on, .ibtn.on:hover { background: var(--green-bg); color: var(--green); }   /* 켜진 토글(📡·🔔)은 초록 */
  .ibtn svg { width: 17px; height: 17px; stroke: currentColor; stroke-width: 1.7; fill: none; stroke-linecap: round; stroke-linejoin: round; }
  .divider { width: 1px; height: 18px; background: var(--line); margin: 0 6px; }
  .wbtn { width: 46px; height: 50px; border: 0; background: none; color: var(--val); display: flex; align-items: center; justify-content: center; cursor: pointer; }
  .wbtn:hover { background: var(--btn); }
  .wbtn.close:hover { background: #C42B1C; color: #fff; }
  .wbtn svg { width: 11px; height: 11px; stroke: currentColor; stroke-width: 1.2; fill: none; }

  /* ── 장비 카드 ── */
  #list { padding: 10px; }
  .card { display: flex; background: var(--card); border-radius: 10px; margin: 0 0 10px; padding: 8px 16px 8px 8px; cursor: pointer; }
  .card:last-child { margin-bottom: 0; }
  .strip { width: 5px; border-radius: 3px; background: #5A5A60; flex: none; transition: background .3s; }
  .content { flex: 1; min-width: 0; padding: 2px 0 2px 12px; }
  .row { display: flex; align-items: center; gap: 6px; }
  .name { font-size: 16px; font-weight: 700; white-space: nowrap; }
  .ip { font: 11px var(--mono); color: var(--sub); margin-left: 4px; }
  .badge { margin-left: auto; font-size: 11px; font-weight: 700; border-radius: 11px; padding: 3px 0; width: 86px; text-align: center; flex: none; }
  .chev { width: 16px; height: 16px; stroke: var(--sub); stroke-width: 1.6; fill: none; margin-left: 8px; flex: none; transition: transform .22s ease; }
  .card.open .chev { transform: rotate(180deg); }
  .ctime { display: none; margin-left: auto; font: 700 14px var(--mono); }
  .row2 { margin-top: 10px; }
  .conn { display: flex; align-items: center; gap: 5px; height: 26px; padding: 0 10px; border-radius: 6px; background: none; flex: none;
          font-size: 11px; font-weight: 700; cursor: pointer; border: 1px solid var(--green); color: var(--green); }
  .conn:hover { background: var(--green-bg); }
  .conn.on { border-color: var(--outline); color: var(--muted); }
  .conn.on:hover { background: var(--btn); }
  .conn svg { width: 13px; height: 13px; stroke: currentColor; stroke-width: 1.6; fill: none; stroke-linecap: round; }
  .k { font-size: 10px; color: var(--sub); margin-left: 14px; white-space: nowrap; }
  .v { font: 14px var(--mono); color: var(--sub); white-space: nowrap; }
  .v.on { color: var(--val); }
  .prg { max-width: 130px; overflow: hidden; text-overflow: ellipsis; }
  .time { margin-left: auto; font: 700 22px var(--mono); color: var(--sub); white-space: nowrap; }

  /* 알람 목록 (알람일 때만) */
  .alarms { display: none; grid-template-columns: auto 1fr auto; gap: 4px 12px; margin-top: 10px; padding-top: 7px;
            border-top: 1px solid var(--alm-line); font-size: 12px; }
  .alarms.show { display: grid; }
  .alarms .c { font: 700 12px var(--mono); color: var(--alm-code); }
  .alarms .m { color: var(--alm-msg); overflow-wrap: anywhere; }
  .alarms .t { font: 11px var(--mono); color: var(--alm-sub); }

  /* 부하·가동률 패널 — grid 0fr → 1fr 전환이라 내용 높이를 몰라도 부드럽게 늘어난다 (GPU 합성) */
  .panel { display: grid; grid-template-rows: 0fr; transition: grid-template-rows .22s cubic-bezier(.2,.7,.3,1); }
  .card.open .panel { grid-template-rows: 1fr; }
  .panel > div { overflow: hidden; }
  .inner { border-top: 1px solid var(--line); margin-top: 10px; padding-top: 9px; }
  .lrow { display: grid; grid-template-columns: 46px 1fr 42px 76px; align-items: center; gap: 6px; font-size: 10px; color: var(--sub); }
  .bar { height: 9px; border-radius: 5px; background: var(--btn); overflow: hidden; }
  .bar i { display: block; height: 100%; border-radius: 5px; width: 0; transition: width .4s ease, background .3s; }
  .pct { text-align: right; font: 700 11px var(--mono); }
  .rpm { text-align: right; font: 10px var(--mono); }
  .axes { display: grid; gap: 4px 10px; margin-top: 9px; }
  .axis .top { display: flex; justify-content: space-between; font: 10px var(--mono); color: var(--sub); }
  .axis .top .p { color: var(--val); }
  .axis .bar { height: 6px; margin-top: 2px; }
  .util { margin-top: 10px; font-size: 10px; color: var(--sub); display: flex; align-items: baseline; gap: 6px; }
  .util b { font: 700 12px var(--mono); color: var(--text); }
  .tl { position: relative; height: 8px; background: var(--btn); border-radius: 2px; overflow: hidden; margin-top: 5px; }
  .tl i { position: absolute; top: 0; bottom: 0; }
  .tlx { display: flex; justify-content: space-between; font: 9px var(--mono); color: var(--sub); margin-top: 2px; }

  /* ── 최소화(슬림) 모드: 이름 + 사이클 타임만, 끌어서 이동, 누르면 원래 크기 ── */
  body.compact .titlebar, body.compact .row2, body.compact .ip, body.compact .badge, body.compact .chev,
  body.compact .panel, body.compact .alarms { display: none !important; }
  body.compact #list { padding: 8px; }
  body.compact .card { padding: 5px 10px 5px 6px; margin-bottom: 6px; cursor: move; }
  body.compact .content { padding-left: 8px; }
  body.compact .name { font-size: 14px; }
  body.compact .ctime { display: block; }

  /* ── 툴팁 ── */
  #tip { position: fixed; z-index: 50; display: none; background: #2A2A2A; color: #fff; border: 1px solid #444; font-size: 12px;
         padding: 4px 8px; white-space: pre-line; text-align: center; pointer-events: none; max-width: 320px; }

  /* ── 모달 (설정 창·원격 PIN 창·알람 팝업·메시지) ── */
  .overlay { position: fixed; inset: 0; z-index: 40; background: rgba(0,0,0,.55); display: flex; align-items: center; justify-content: center; }
  .modal { background: var(--bg); border: 1px solid var(--line); border-radius: 10px; width: 340px; max-width: calc(100vw - 20px); padding: 14px 18px 16px; }
  .modal h3 { margin: 0 0 4px; font-size: 14px; }
  .modal .lbl { font-size: 11px; color: var(--sub); margin: 12px 0 4px; }
  .modal input { width: 100%; height: 32px; background: var(--card); border: 1px solid var(--line); border-radius: 6px; color: var(--val);
                 font: 13px var(--mono); padding: 0 10px; outline: none; user-select: text; }
  .modal input:focus { border-color: var(--accent); }
  .modal .msg { min-height: 18px; font-size: 11px; color: var(--alm-code); margin-top: 6px; white-space: pre-line; }
  .modal .msg.ok { color: var(--green); }
  .modal .btns { display: flex; gap: 8px; margin-top: 8px; }
  .modal .btns button { flex: 1; height: 32px; border-radius: 6px; border: 0; font-size: 12px; cursor: pointer; }
  .b-primary { background: var(--accent); color: #fff; font-weight: 700; }
  .b-primary:hover { background: var(--accent-hov); }
  .b-plain { background: var(--btn); color: var(--muted); }
  .b-plain:hover { background: var(--btn-hov); }
  .b-outline { background: none !important; border: 1px solid var(--outline) !important; color: var(--muted); }
  .url { height: 30px; border-radius: 6px; background: var(--card); color: var(--muted); font: 11px var(--ui); display: flex; align-items: center; padding: 0 10px; }
  .url.on { background: var(--green-bg); color: var(--green); font: 12px var(--mono); }
  /* 장비 설정 표 */
  .modal.wide { width: 520px; }
  .mrow { display: grid; grid-template-columns: 140px 1fr 80px 32px; gap: 8px; margin-top: 6px; }
  .mrow.head { font-size: 11px; color: var(--sub); margin-top: 10px; }
  .mrow .del { height: 32px; border: 0; border-radius: 6px; background: #2A1513; color: #FF6961; cursor: pointer; }
  .mrow .del:hover { background: #3A1B18; }
  .mlist { max-height: 260px; overflow-y: auto; }
  /* 알람 팝업 */
  .alarm { width: 300px; text-align: center; padding: 22px 18px 18px; }
  .alarm .ring { width: 56px; height: 56px; border-radius: 50%; background: #33100D; color: var(--red); margin: 0 auto 10px;
                 display: flex; align-items: center; justify-content: center; }
  .alarm .ring svg { width: 26px; height: 26px; stroke: currentColor; stroke-width: 1.8; fill: none; stroke-linejoin: round; stroke-linecap: round; }
  .alarm .t1 { font-size: 18px; font-weight: 700; color: var(--red); }
  .alarm .t2 { font-size: 15px; font-weight: 700; margin-top: 2px; }
  .alarm .box { background: var(--card); border-radius: 8px; margin: 12px 0 6px; padding: 4px 12px 8px; text-align: left; }
  .alarm .box .c { font: 700 12px var(--mono); color: var(--alm-code); margin-top: 6px; }
  .alarm .box .m { font-size: 12px; color: var(--val); overflow-wrap: anywhere; }
  .alarm .when { font-size: 11px; color: var(--muted); margin-bottom: 14px; }
  .alarm .ok { width: 120px; height: 30px; border-radius: 8px; background: #33100D; color: #FF6961; border: 1px solid #6E2420; font-weight: 700; cursor: pointer; }
  .alarm .ok:hover { background: #4A1815; }
</style></head>
<body>
<div id="app">
  <div class="titlebar">
    <div class="drag pywebview-drag-region"><span id="dot">●</span><span id="sum">불러오는 중…</span><span id="total"></span></div>
    <button class="ibtn" id="b-remote" data-tip="원격 모니터링: 꺼짐&#10;우클릭: 설정"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="2"/><path d="M16.24 7.76a6 6 0 0 1 0 8.49m-8.48 0a6 6 0 0 1 0-8.49m11.31-2.82a10 10 0 0 1 0 14.14m-14.14 0a10 10 0 0 1 0-14.14"/></svg></button>
    <button class="ibtn" id="b-settings" data-tip="장비 설정"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg></button>
    <button class="ibtn on" id="b-bell" data-tip="알림: 켜짐"></button>
    <button class="ibtn" id="b-compact" data-tip="최소화 모드"><svg viewBox="0 0 24 24"><path d="M4 14h6v6M20 10h-6V4M14 10l7-7M3 21l7-7"/></svg></button>
    <span class="divider"></span>
    <button class="wbtn" id="b-min" aria-label="최소화"><svg viewBox="0 0 12 12"><path d="M1 6h10"/></svg></button>
    <button class="wbtn close" id="b-close" aria-label="닫기 (트레이로)"><svg viewBox="0 0 12 12"><path d="M1 1l10 10M11 1L1 11"/></svg></button>
  </div>
  <div id="list"></div>
</div>
<div id="tip"></div>
<div id="modals"></div>
<script>
const C = { RUN:["#30D158","#0E2E1A"], ALARM:["#FF453A","#3A0E0C"], HOLD:["#FFD60A","#332B08"], IDLE:["#98989D","#26262C"], OFFLINE:["#5A5A60","#222226"] };
const ICON = {
  plug: '<svg viewBox="0 0 16 16"><path d="M6 1v4M10 1v4M4 5h8v3a4 4 0 0 1-8 0zM8 12v3"/></svg>',
  bell: '<svg viewBox="0 0 24 24"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.7 21a2 2 0 0 1-3.4 0"/></svg>',
  bellOff: '<svg viewBox="0 0 24 24"><path d="M13.7 21a2 2 0 0 1-3.4 0M18.6 13A17.9 17.9 0 0 1 18 8M6.3 6.3A5.9 5.9 0 0 0 6 8c0 7-3 9-3 9h14M18 8a6 6 0 0 0-9.3-5M1 1l22 22"/></svg>',
  warn: '<svg viewBox="0 0 24 24"><path d="M10.3 3.9 1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0z"/><path d="M12 9v4M12 17h.01"/></svg>',
};
const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const api = () => window.pywebview.api;
const cards = {};          // ip → {el, r}
let last = null, info = {}, compact = false, animating = false, remoteUrls = "";

// ── 부하 막대: 0~150% 눈금, 80% 이상 노랑 · 100% 이상 빨강 ──
const loadCol = p => p == null ? "#636366" : p >= 100 ? "#FF453A" : p >= 80 ? "#FFD60A" : "#30D158";
const setBar = (i, p) => { i.style.width = Math.min(p || 0, 150) / 1.5 + "%"; i.style.background = loadCol(p); };

function makeCard(m) {
  const el = document.createElement("div");
  el.className = "card";
  el.innerHTML = `<span class="strip"></span><div class="content">
    <div class="row"><span class="name"></span><span class="ip"></span><span class="badge"></span><span class="ctime"></span>
      <svg class="chev" viewBox="0 0 16 16"><path d="M4 6l4 4 4-4"/></svg></div>
    <div class="row row2"><button class="conn"></button>
      <span class="k">MODE</span><span class="v mode">-</span><span class="k">TOOL</span><span class="v tool">-</span>
      <span class="k">PRG</span><span class="v prg">-</span><span class="time">-</span></div>
    <div class="alarms"></div>
    <div class="panel"><div><div class="inner">
      <div class="lrow"><span>스핀들</span><span class="bar"><i class="spb"></i></span><span class="pct spp">-</span><span class="rpm">-</span></div>
      <div class="axes"></div>
      <div class="util">오늘 가동률 <b class="up">-</b><span class="us"></span></div>
      <div class="tl"></div><div class="tlx"><span>0시</span><span class="now">지금</span></div>
    </div></div></div></div>`;
  const q = s => el.querySelector(s);
  const r = { strip: q(".strip"), name: q(".name"), ip: q(".ip"), badge: q(".badge"), ctime: q(".ctime"), conn: q(".conn"),
              mode: q(".mode"), tool: q(".tool"), prg: q(".prg"), time: q(".time"), alarms: q(".alarms"), panel: q(".panel"),
              spb: q(".spb"), spp: q(".spp"), rpm: q(".rpm"), axes: q(".axes"), up: q(".up"), us: q(".us"), tl: q(".tl"), now: q(".now"),
              axisNames: null, axisRefs: {}, almKey: "", ip_: m.ip };
  r.conn.addEventListener("click", e => {   // 연결 버튼은 카드 펼치기와 별개
    e.stopPropagation();
    r.conn.dataset.on === "1" ? api().disconnect(r.ip_) : api().connect(r.ip_);
  });
  el.addEventListener("mousedown", e => { if (compact && e.button === 0) compactDrag(); });
  el.addEventListener("click", () => { if (!compact) toggle(el, r); });
  return { el, r };
}

function update(m) {
  const c = cards[m.ip] || (cards[m.ip] = makeCard(m));
  const r = c.r, on = m.connected, [fg, bg] = C[m.state] || C.IDLE;
  r.ip_ = m.ip;
  r.strip.style.background = fg;
  r.name.textContent = m.name; r.ip.textContent = m.ip;
  const n = m.state === "ALARM" && m.alarms.length > 1 ? " " + m.alarms.length : "";
  r.badge.textContent = { RUN: "● RUN", ALARM: "▲ ALARM" + n, HOLD: "HOLD", OFFLINE: "OFFLINE" }[m.state] || m.status;
  r.badge.style.color = fg; r.badge.style.background = bg;
  if (r.conn.dataset.on !== (on ? "1" : "0")) {
    r.conn.dataset.on = on ? "1" : "0"; r.conn.className = "conn" + (on ? " on" : "");
    r.conn.innerHTML = ICON.plug + (on ? "해제" : "연결");
  }
  for (const [el, val] of [[r.mode, m.mode], [r.tool, m.tool], [r.prg, m.program]]) {
    el.textContent = on && val ? val : "-"; el.classList.toggle("on", on);
  }
  r.prg.title = on && m.program ? m.program : "";
  const tc = m.state === "ALARM" ? fg : (on ? "#F2F2F7" : "#636366");
  for (const el of [r.time, r.ctime]) { el.textContent = on ? m.cycle_time : "-"; el.style.color = tc; }

  // 알람 목록 (내용이 바뀔 때만 다시 그림)
  const alarms = m.state === "ALARM" ? m.alarms : [];
  const key = alarms.map(a => a.code + a.msg).join("|");
  if (key !== r.almKey) {
    r.almKey = key;
    r.alarms.innerHTML = alarms.map(a => `<span class="c">${esc(a.code)}</span><span class="m">${esc(a.msg)}</span><span class="t">${esc(a.since)}</span>`).join("");
    r.alarms.classList.toggle("show", alarms.length > 0);
  }

  // 부하 (축 이름·개수는 기계에서 받은 그대로 — 바뀌면 칸을 다시 만든다)
  const sp = on ? m.spindle_load : null;
  setBar(r.spb, sp); r.spp.textContent = sp == null ? "-" : sp + "%"; r.spp.style.color = loadCol(sp);
  r.rpm.textContent = on && m.spindle_rpm != null ? m.spindle_rpm.toLocaleString() + "rpm" : "-";
  const names = m.axis_loads.map(a => a[0]).join(",");
  if (names !== r.axisNames && (names || r.axisNames === null)) {
    r.axisNames = names; r.axisRefs = {};
    r.axes.style.display = m.axis_loads.length ? "grid" : "none";
    r.axes.style.gridTemplateColumns = `repeat(${Math.max(1, m.axis_loads.length)}, 1fr)`;
    r.axes.innerHTML = m.axis_loads.map(([a]) => `<div class="axis"><div class="top"><span>${esc(a)}</span><span class="p" data-p="${esc(a)}">-</span></div><div class="bar"><i data-b="${esc(a)}"></i></div></div>`).join("");
    for (const [a] of m.axis_loads) r.axisRefs[a] = [r.axes.querySelector(`[data-p="${a}"]`), r.axes.querySelector(`[data-b="${a}"]`)];
  }
  const loads = Object.fromEntries(m.axis_loads);
  for (const [a, [t, b]] of Object.entries(r.axisRefs)) { const v = on ? loads[a] : null; t.textContent = v == null ? "-" : v + "%"; setBar(b, v); }

  // 오늘 가동률 + 0시 → 지금 타임라인 (가공 초록 · 알람 빨강)
  const u = m.util;
  if (u) {
    const mins = Math.floor(u.run_sec / 60), h = Math.floor(mins / 60);
    r.up.textContent = Math.round(u.ratio * 100) + "%";
    r.us.textContent = "· 가공 " + (h ? `${h}시간 ${mins % 60}분` : `${mins}분`);
    r.tl.innerHTML = u.segments.map(([s, e, st]) =>
      `<i style="left:${s / u.now_sec * 100}%;width:${Math.max((e - s) / u.now_sec * 100, .3)}%;background:${C[st][0]}"></i>`).join("");
    r.now.textContent = "지금 " + new Date().toTimeString().slice(0, 5);
  }
  return c;
}

function render(d) {
  last = d;
  const list = $("list"), seen = new Set();
  for (const m of d.machines) { list.appendChild(update(m).el); seen.add(m.ip); }   // 설정 순서대로 정렬
  for (const ip of Object.keys(cards)) if (!seen.has(ip)) { cards[ip].el.remove(); delete cards[ip]; }
  $("dot").style.color = d.summary.color; $("sum").textContent = d.summary.text;
  $("sum").style.color = d.summary.color === "#FF453A" ? "#FF453A" : (d.summary.text === "연결된 장비 없음" ? "#8E8E93" : "#F2F2F7");
  $("total").textContent = `/  전체 ${d.summary.total}대`;
  setRemote(d.remote); setBell(d.notify);
  for (const e of d.events || []) handleEvent(e);
  if (!animating) fitWindow();   // 움직이는 중에 재면 중간 높이로 창이 줄어듦
}

// ── 창 높이: 내용에 맞춤. 펼칠 땐 애니메이션 전에 늘리고, 접을 땐 끝난 뒤 줄인다 ──
let fitted = 0, minHeight = 0;
function fitWindow(extra = 0) {
  const h = Math.max(Math.ceil($("app").getBoundingClientRect().height) + extra, minHeight);
  if (Math.abs(h - fitted) > 1) { fitted = h; api().fit(h); }
}

function toggle(el, r) {
  const opening = !el.classList.contains("open");
  animating = true;
  if (opening) fitWindow(r.panel.firstElementChild.scrollHeight);
  el.classList.toggle("open");
  setTimeout(() => { animating = false; fitWindow(); }, 260);
}

// ── 헤더 버튼 ──
function setRemote(on) {
  const b = $("b-remote");
  if (b.classList.contains("on") === on) return;
  b.classList.toggle("on", on);
  b.dataset.tip = on ? "원격 모니터링: 켜짐 (절전 차단 중)" + remoteUrls + "\n우클릭: 설정" : "원격 모니터링: 꺼짐\n우클릭: 설정";
  if (on) api().remote_info().then(i => {   // Funnel 주소 확인은 최대 3초 → 받아오면 툴팁에 추가
    remoteUrls = "\n" + [i.funnel, ...i.urls].filter(Boolean).join("\n");
    if (b.classList.contains("on")) b.dataset.tip = "원격 모니터링: 켜짐 (절전 차단 중)" + remoteUrls + "\n우클릭: 설정";
  });
}
function setBell(on) {
  const b = $("b-bell");
  if (b.dataset.state === String(on)) return;
  b.dataset.state = String(on); b.classList.toggle("on", on);
  b.innerHTML = on ? ICON.bell : ICON.bellOff; b.dataset.tip = on ? "알림: 켜짐" : "알림: 꺼짐";
}
$("b-bell").addEventListener("click", async () => setBell(await api().set_notify($("b-bell").dataset.state !== "true")));
$("b-remote").addEventListener("click", async () => {
  const r = await api().remote_toggle();
  if (r.need_pin) openRemote(); else setRemote(r.running);
});
$("b-remote").addEventListener("contextmenu", e => { e.preventDefault(); openRemote(); });
$("b-settings").addEventListener("click", openSettings);
$("b-compact").addEventListener("click", () => setCompact(true));
$("b-min").addEventListener("click", () => api().minimize());
$("b-close").addEventListener("click", () => api().hide());

// ── 최소화(슬림) 모드 ──
function setCompact(on) {
  compact = on; hideTip();
  document.body.classList.toggle("compact", on);
  requestAnimationFrame(() => { fitted = Math.ceil($("app").getBoundingClientRect().height); api().set_compact(on, fitted); });
}
async function compactDrag() {
  const moved = await api().compact_drag();   // 버튼을 놓을 때까지 창이 마우스를 따라감
  if (moved < 4) setCompact(false);           // 거의 안 움직였으면 '클릭' → 원래 크기로
}

// ── 툴팁 ──
document.addEventListener("mouseover", e => {
  const t = e.target.closest("[data-tip]");
  if (!t || compact) return hideTip();
  const tip = $("tip"), rc = t.getBoundingClientRect();
  tip.textContent = t.dataset.tip; tip.style.display = "block";
  const w = tip.offsetWidth;
  tip.style.left = Math.max(4, Math.min(innerWidth - w - 4, rc.left + rc.width / 2 - w / 2)) + "px";
  tip.style.top = rc.bottom + 5 + "px";
});
function hideTip() { $("tip").style.display = "none"; }

// ── 모달 공통 ──
function openModal(html, cls = "") {
  hideTip();
  const ov = document.createElement("div");
  ov.className = "overlay";
  ov.innerHTML = `<div class="modal ${cls}">${html}</div>`;
  $("modals").appendChild(ov);
  minHeight = ov.firstElementChild.offsetHeight + 40;   // 창이 모달보다 작으면 잠깐 늘림
  fitWindow();
  return ov;
}
function closeModal(ov) {
  ov.remove();
  const rest = $("modals").lastElementChild;
  minHeight = rest ? rest.firstElementChild.offsetHeight + 40 : 0;
  fitWindow();
}
function message(text) {
  const ov = openModal(`<h3>알림</h3><div class="msg" style="color:var(--val);font-size:12px">${esc(text)}</div>
    <div class="btns"><button class="b-primary">확인</button></div>`);
  ov.querySelector("button").onclick = () => closeModal(ov);
}

// ── 장비 설정 창 ──
async function openSettings() {
  const rows = await api().get_machines();
  const ov = openModal(`<h3>장비 설정</h3>
    <div class="mrow head"><span>장비명</span><span>IP 주소</span><span>포트</span><span></span></div>
    <div class="mlist"></div>
    <div class="msg"></div>
    <div class="btns"><button class="b-outline add" style="flex:none;width:110px">＋ 장비 추가</button><span style="flex:1"></span>
      <button class="b-plain cancel" style="flex:none;width:90px">취소</button><button class="b-primary save" style="flex:none;width:90px">저장</button></div>`, "wide");
  const list = ov.querySelector(".mlist");
  const addRow = (m = { name: "", ip: "", port: 8193 }) => {
    const row = document.createElement("div");
    row.className = "mrow";
    row.innerHTML = `<input class="n" placeholder="예: DVF5000"><input class="i" placeholder="예: 192.168.10.109"><input class="p"><button class="del" title="삭제">✕</button>`;
    row.querySelector(".n").value = m.name; row.querySelector(".i").value = m.ip; row.querySelector(".p").value = m.port;
    row.querySelector(".del").onclick = () => row.remove();
    list.appendChild(row);
  };
  rows.forEach(addRow);
  ov.querySelector(".add").onclick = () => { addRow(); list.scrollTop = list.scrollHeight; };
  ov.querySelector(".cancel").onclick = () => closeModal(ov);
  ov.querySelector(".save").onclick = async () => {
    const data = [...list.children].map(r => ({ name: r.querySelector(".n").value, ip: r.querySelector(".i").value, port: r.querySelector(".p").value }));
    const res = await api().save_machines(data);
    if (res.error) ov.querySelector(".msg").textContent = res.error; else closeModal(ov);
  };
}

// ── 원격 모니터링 설정 창 (PIN 설정/변경, Funnel 주소, 모든 기기 로그아웃) ──
async function openRemote() {
  const ov = openModal(`<h3>원격 모니터링 설정</h3>
    <div class="lbl">외부 접속 주소 (Tailscale Funnel)</div><div class="url">확인 중…</div>
    <div class="lbl pinl">새 PIN (숫자 ${info.pin_len}자리)</div><input class="p1" type="password" inputmode="numeric" maxlength="${info.pin_len}">
    <div class="lbl">PIN 확인</div><input class="p2" type="password" inputmode="numeric" maxlength="${info.pin_len}">
    <div class="msg"></div>
    <div class="btns"><button class="b-plain logout" style="display:none">모든 기기 로그아웃</button><button class="b-primary save">저장 후 켜기</button></div>`);
  const q = s => ov.querySelector(s), msg = (t, ok) => { q(".msg").textContent = t; q(".msg").className = "msg" + (ok ? " ok" : ""); };
  q(".p1").focus();
  const i = await api().remote_info();
  q(".url").textContent = i.funnel || "Funnel 꺼짐 · 사내망/Tailscale로만 접속"; q(".url").classList.toggle("on", !!i.funnel);
  if (i.has_pin) { q(".pinl").textContent = "PIN 변경 (비워두면 그대로)"; q(".logout").style.display = ""; }
  if (i.running) q(".save").textContent = "저장";
  q(".logout").onclick = async () => {
    if (!confirm("로그인된 모든 휴대폰에서 로그아웃할까요?\n다시 접속하려면 PIN을 입력해야 해요.")) return;
    await api().remote_logout_all(); msg("모든 기기를 로그아웃했어요", true);
  };
  const save = async () => {
    const p1 = q(".p1").value.trim(), p2 = q(".p2").value.trim();
    if ((p1 || p2) && p1 !== p2) return msg("PIN 확인이 일치하지 않아요");
    const res = await api().remote_save(p1);
    if (res.error) msg(res.error); else closeModal(ov);
  };
  q(".save").onclick = save;
  ov.addEventListener("keydown", e => { if (e.key === "Enter") save(); if (e.key === "Escape") closeModal(ov); });
}

// ── 알람 팝업·오류 (장비 스레드가 보낸 이벤트) ──
function handleEvent(e) {
  if (e.type === "error") return message(e.msg);
  if (e.type !== "alarm") return;
  const al = e.alarms || [];
  const box = al.length ? `<div class="box">${al.slice(0, 3).map(a => `<div class="c">${esc(a.code)}</div><div class="m">${esc(a.msg)}</div>`).join("")}
      ${al.length > 3 ? `<div class="m" style="color:var(--muted);margin-top:4px">외 ${al.length - 3}건</div>` : ""}</div>` : "";
  const when = al.length ? al[0].since : new Date().toTimeString().slice(0, 8);
  const ov = openModal(`<div class="ring">${ICON.warn}</div><div class="t1">ALARM</div><div class="t2">${esc(e.name)}</div>${box}
    <div class="when">${esc(when)} 발생 · 장비 상태를 확인하세요</div><button class="ok">확인</button>`, "alarm");
  ov.querySelector(".ok").onclick = () => closeModal(ov);
  if (!info.selftest) api().attention();   // 숨겨져 있어도 창을 앞으로 + 경고음
}

async function poll() {
  try { render(await api().status()); } catch (e) { console.error(e); }
  setTimeout(poll, 500);
}

window.addEventListener("pywebviewready", async () => {
  info = await api().init();
  setBell(info.notify);
  poll();
  if (info.selftest) setTimeout(selftest, 800);
});

// ── 자가 테스트 (main.py --selftest): 실장비 연결 → 펼치기/접기 → 설정 창 → 결과 기록 후 종료 ──
async function selftest() {
  const wait = ms => new Promise(r => setTimeout(r, ms)), out = [];
  for (const ip of Object.keys(cards)) api().connect(ip);
  for (let i = 0; i < 30 && !(last && last.machines.some(m => m.connected && m.axis_loads.length)); i++) await wait(300);
  const first = Object.values(cards)[0];
  for (let i = 0; i < 2; i++) {
    let frames = 0; const t0 = performance.now(), count = () => { frames++; if (performance.now() - t0 < 260) requestAnimationFrame(count); };
    requestAnimationFrame(count); toggle(first.el, first.r); await wait(500);
    out.push(`${i ? "닫기" : "열기"} ${Math.round(frames / .26)}fps`);
    if (i === 0) { await wait(300); await api().report("screenshot:open"); }
  }
  setCompact(true); await wait(500); await api().report("screenshot:compact"); setCompact(false); await wait(400);
  await openSettings(); await wait(300); await api().report("screenshot:settings");
  closeModal($("modals").lastElementChild); await wait(200);
  await openRemote(); await wait(300); await api().report("screenshot:remote");
  closeModal($("modals").lastElementChild); await wait(200);
  handleEvent({ type: "alarm", name: "DVF5000", alarms: [{ code: "SV0401", msg: "IMPROPER V_READY OFF", since: "14:21:07" },
                                                         { code: "EX1012", msg: "주축 알람 (SPINDLE AMP ALARM)", since: "14:21:07" }] });
  await wait(300); await api().report("screenshot:alarm");
  closeModal($("modals").lastElementChild); await wait(200);
  for (const act of ["hide", "state", "show", "state", "wmclose", "state", "show"]) { await api().report("test:" + act); await wait(500); }
  api().report(`selftest done | ${out.join(" | ")} | 장비 스레드 ${last.loop_ms}ms | 연결 ${last.machines.filter(m => m.connected).length}대`);
}
</script>
